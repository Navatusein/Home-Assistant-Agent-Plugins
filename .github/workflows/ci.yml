name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The plugin API from the agent's sources (see Directory.Build.props).
      - uses: actions/checkout@v4
        with:
          repository: Navatusein/Home-Assistant-Agent
          path: .agent

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build HomeAssistant.Agent.Plugins.sln -c Release

      - name: Test
        run: dotnet test tests/HomeAssistant.Agent.Plugins.Tests/HomeAssistant.Agent.Plugins.Tests.csproj -c Release --no-build
